version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
  
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # bruno-electron은 레거시(웹 모드 제품에서 사용하지 않음) — 업그레이드 PR을 받지 않는다
    ignore:
      - dependency-name: "electron"
      - dependency-name: "electron-*"
      - dependency-name: "@electron/*"
    groups:
      bruno-dependencies:
        patterns:
          - "*usebruno*"
      babel-dependencies:
        patterns:
          - "*babel*"
      fortawesome-dependencies:
        patterns:
          - "*fortawesome*"
      rollup-dependencies:
        patterns:
          - "*rollup*"
      jest-dependencies:
        patterns:
          - "*jest*"
