name: Windows Tests
on:
  workflow_dispatch:
  push:
    branches: [main, 'release/v*']
  pull_request:
    branches: [main, 'release/v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit Tests (Windows)
    if: false # @TODO: Temporarily disabled. Remove this once the tests are fixed.
    timeout-minutes: 60
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          shell: pwsh

      - name: Run Unit Tests
        uses: ./.github/actions/tests/run-unit-tests
        with:
          shell: pwsh

  cli-test:
    name: CLI Tests (Windows)
    runs-on: windows-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node Dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          shell: pwsh

      - name: Run CLI Tests
        uses: ./.github/actions/tests/run-cli-tests
        with:
          shell: pwsh

      - name: Publish Test Report
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always()
        with:
          check_name: CLI Test Results (Windows)
          files: packages/bruno-tests/collection/junit.xml
          comment_mode: off
          check_run: false
